name: CI Pipeline - Grupo Cordillera

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  # ── Build y Test Backend ───────────────────────────────────────────────────
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (Maven)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B -q

  # ── Build y Test Frontend ──────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install y build
        working-directory: frontend
        run: |
          npm install
          npm run build

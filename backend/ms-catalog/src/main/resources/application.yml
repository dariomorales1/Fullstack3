server:
  port: 8082

spring:
  application:
    name: ms-catalog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos360}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos360}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

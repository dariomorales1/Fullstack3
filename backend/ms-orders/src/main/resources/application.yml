server:
  port: 8081

spring:
  application:
    name: ms-orders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos360}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos360}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASS:pedidos360}

pedidos360:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8082}
    stock-sync: ${CATALOG_STOCK_SYNC:true}
  rabbit:
    enabled: ${RABBIT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

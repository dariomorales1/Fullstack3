spring:
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  rabbitmq:
    dynamic: false
  kafka:
    listener:
      auto-startup: false

pedidos360:
  catalog:
    stock-sync: false
  rabbit:
    enabled: false
  kafka:
    enabled: false

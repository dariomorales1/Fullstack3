server:
  port: 8092

spring:
  application:
    name: ms-reporting
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5436/db_reporting
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  docker:
    compose:
      file: cordillera/core-intelligence/ms-reporting/docker-compose.yml

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

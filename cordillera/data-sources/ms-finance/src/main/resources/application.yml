server:
  port: 8083

spring:
  application:
    name: ms-finance
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5434/db_finance
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  docker:
    compose:
      file: cordillera/data-sources/ms-finance/docker-compose.yml

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
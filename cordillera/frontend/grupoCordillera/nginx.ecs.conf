server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Service Connect resuelve los alias escribiendo entradas reales en /etc/hosts de cada tarea
        # (ej. "127.255.0.1 api-gateway.cordillera-dns.local"), NO via DNS real. La directiva `resolver`
        # de nginx hace consultas DNS UDP directas e IGNORA /etc/hosts por diseno, por eso fallaba (502).
        # proxy_pass estatico usa la resolucion del sistema (getaddrinfo, que SI consulta /etc/hosts)
        # una sola vez al cargar la config - confirmado que /etc/hosts ya tiene la entrada correcta
        # antes de que nginx arranque (verificado via CMD de diagnostico).
        proxy_pass http://api-gateway.cordillera-dns.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  cloud:
    gateway:
      routes:
        - id: bff-dashboard
          uri: lb://bff
          predicates:
            - Path=/api/dashboard/**
        - id: bff-kpis
          uri: lb://bff
          predicates:
            - Path=/api/kpis/**
        - id: bff-reports
          uri: lb://bff
          predicates:
            - Path=/api/reports/**
        - id: sales-route
          uri: lb://ms-sales
          predicates:
            - Path=/api/sales/**
        - id: inventory-route
          uri: lb://ms-inventory
          predicates:
            - Path=/api/inventory/**
        - id: finance-route
          uri: lb://ms-finance
          predicates:
            - Path=/api/finance/**
        - id: customer-route
          uri: lb://ms-customer
          predicates:
            - Path=/api/customers/**
        - id: ingestion-route
          uri: lb://ms-data-ingestion
          predicates:
            - Path=/api/ingestion/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: 8085

spring:
  application:
    name: bff
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:}

# URLs directas para las llamadas de bff a los microservicios de core-intelligence.
# Antes estaban hardcodeadas a host.docker.internal (nunca funciono en EC2 ni en ECS).
# Default de desarrollo local; en EC2/ECS se sobreescriben via env var.
services:
  ms-kpis:
    url: ${MS_KPIS_URL:http://localhost:8091}
  ms-reporting:
    url: ${MS_REPORTING_URL:http://localhost:8092}
  ms-data-ingestion:
    url: ${MS_DATA_INGESTION_URL:http://localhost:8090}

resilience4j:
  circuitbreaker:
    instances:
      kpisService:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      reportingService:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      ingestionService:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      kpisService:
        timeout-duration: 5s
      reportingService:
        timeout-duration: 5s
      ingestionService:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

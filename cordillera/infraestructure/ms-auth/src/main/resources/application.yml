server:
  port: 8086

spring:
  application:
    name: ms-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/db_auth
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  docker:
    compose:
      file: cordillera/infraestructure/ms-auth/docker-compose.yml
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.server.EurekaServerAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:cordillera-secret-key-2026-grupo-fullstack3-muy-segura}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

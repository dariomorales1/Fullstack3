# Configuracion de los nodos del cluster RabbitMQ (dimension Defensa).
# Ambos nodos comparten esta config y la misma cookie de Erlang, por lo que
# se descubren y forman cluster automaticamente al arrancar (classic_config).

default_user = pedidos360
default_pass = pedidos360
loopback_users.guest = false

# Descubrimiento de pares: lista fija de nodos del cluster.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Ante una particion de red, sanar automaticamente.
cluster_partition_handling = autoheal
